<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSL Turni — Maggio 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0f14;--surface:#161a22;--surface2:#1e2330;--border:#2a3042;
  --text:#e8eaf0;--muted:#6b7280;--accent:#3b82f6;
  --mattina:#f59e0b;--pomeriggio:#f97316;--notte:#6366f1;
  --rosso:#ef4444;--celeste:#06b6d4;--verde:#10b981;--riposo:#374151;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;}

/* HEADER */
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px 10px;position:sticky;top:0;z-index:100;}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.logo{font-size:10px;font-weight:700;letter-spacing:3px;color:var(--muted);text-transform:uppercase;}
.clock{font-family:'Space Mono',monospace;font-size:13px;color:var(--accent);}
.fascia-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;}
.fm{background:rgba(245,158,11,.15);color:var(--mattina);border:1px solid rgba(245,158,11,.3);}
.fp{background:rgba(249,115,22,.15);color:var(--pomeriggio);border:1px solid rgba(249,115,22,.3);}
.fn{background:rgba(99,102,241,.15);color:var(--notte);border:1px solid rgba(99,102,241,.3);}
.date-nav{display:flex;align-items:center;gap:8px;margin-top:8px;}
.date-nav button{background:var(--surface2);border:1px solid var(--border);color:var(--text);width:32px;height:32px;border-radius:8px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.date-nav button:active{background:var(--border);}
.date-label{font-size:14px;font-weight:700;flex:1;text-align:center;}
.today-btn{background:var(--accent)!important;border-color:var(--accent)!important;color:#fff!important;font-size:10px!important;font-weight:700!important;letter-spacing:1px;width:auto!important;padding:0 10px!important;font-family:'Syne',sans-serif;}
.fascia-sel-row{display:flex;gap:6px;justify-content:center;margin-top:8px;}
.fascia-sel-btn{background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:5px 13px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;font-family:'Syne',sans-serif;}
.fas-m{background:rgba(245,158,11,.15);border-color:rgba(245,158,11,.4);color:var(--mattina);}
.fas-p{background:rgba(249,115,22,.15);border-color:rgba(249,115,22,.4);color:var(--pomeriggio);}
.fas-n{background:rgba(99,102,241,.15);border-color:rgba(99,102,241,.4);color:var(--notte);}

/* HOME */
.home-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 90px);padding:32px 24px;gap:16px;}
.home-logo{font-size:52px;margin-bottom:4px;}
.home-title{font-size:26px;font-weight:800;}
.home-sub{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:1px;text-align:center;margin-bottom:12px;}
.home-btn{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 20px;display:flex;align-items:center;gap:16px;cursor:pointer;text-align:left;}
.home-btn:active{border-color:var(--accent);}
.home-btn-primary{border-color:rgba(59,130,246,.4);background:rgba(59,130,246,.06);}
.home-btn-icon{font-size:28px;flex-shrink:0;}
.home-btn-label{font-size:16px;font-weight:800;color:var(--text);margin-bottom:3px;}
.home-btn-desc{font-size:12px;color:var(--muted);font-weight:600;}

/* HOME SEARCH */
.home-search-wrap{width:100%;margin-top:4px;}
.home-search-label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
.home-search-wrap input{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:12px 16px;border-radius:12px;font-size:15px;font-family:'Syne',sans-serif;outline:none;}
.home-search-wrap input:focus{border-color:var(--accent);}
.home-search-wrap input::placeholder{color:var(--muted);}
.home-result-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-top:8px;display:flex;align-items:center;gap:12px;cursor:pointer;}
.home-result-card:active{border-color:var(--accent);}
.home-result-av{width:38px;height:38px;border-radius:10px;background:rgba(59,130,246,.15);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0;}
.home-result-nome{font-size:14px;font-weight:700;}
.home-result-ruolo{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px;}

/* SEARCH BAR */
.search-bar{padding:10px 14px;border-bottom:1px solid var(--border);}
.search-bar input{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:9px 13px;border-radius:10px;font-size:14px;font-family:'Syne',sans-serif;outline:none;}
.search-bar input::placeholder{color:var(--muted);}
.search-bar input:focus{border-color:var(--accent);}

/* FILTERS */
.filters{padding:8px 14px;display:flex;gap:7px;overflow-x:auto;border-bottom:1px solid var(--border);scrollbar-width:none;}
.filters::-webkit-scrollbar{display:none;}
.filter-btn{background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:5px 13px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:1px;cursor:pointer;white-space:nowrap;font-family:'Syne',sans-serif;text-transform:uppercase;}
.filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.count-bar{padding:6px 14px;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid var(--border);}

/* SEDE / GRUPPO */
.sede-block{margin-top:10px;}
.sede-title{font-size:9px;font-weight:800;letter-spacing:4px;text-transform:uppercase;color:var(--accent);padding:5px 14px;background:rgba(59,130,246,.06);border-top:1px solid rgba(59,130,246,.15);border-bottom:1px solid rgba(59,130,246,.1);}
.gruppo-block{margin-bottom:2px;}
.gruppo-header{display:flex;align-items:center;gap:7px;padding:8px 14px 4px;}
.gruppo-icon{font-size:15px;}
.gruppo-nome{font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
.gruppo-count{margin-left:auto;font-size:11px;font-weight:700;background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:2px 9px;border-radius:10px;}
.gruppo-cards{padding:0 10px 6px;}

/* CARD */
.turno-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:7px;display:flex;align-items:center;gap:12px;position:relative;overflow:hidden;cursor:pointer;}
.turno-card:active{border-color:var(--accent);}
.turno-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;}
.cc-mattina::before{background:var(--mattina);}
.cc-pomeriggio::before{background:var(--pomeriggio);}
.cc-notte::before{background:var(--notte);}
.cc-doppio::before{background:#a78bfa;}
.cc-giorno::before{background:var(--verde);}
.cc-sn::before{background:var(--notte);}
.cc-disp{border-color:rgba(6,182,212,.35);}
.cc-disp::before{background:var(--celeste);}
.cc-riposo{opacity:.45;}
.cc-riposo::before{background:var(--riposo);}
.cc-assente{opacity:.38;}
.cc-assente::before{background:var(--rosso);}
.avatar{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;}
.am{background:rgba(245,158,11,.15);color:var(--mattina);}
.ap{background:rgba(249,115,22,.15);color:var(--pomeriggio);}
.an{background:rgba(99,102,241,.15);color:var(--notte);}
.ag{background:rgba(16,185,129,.15);color:var(--verde);}
.ar{background:rgba(55,65,81,.3);color:var(--muted);}
.aa{background:rgba(239,68,68,.1);color:var(--rosso);}
.ad{background:rgba(6,182,212,.15);color:var(--celeste);}
.adp{background:rgba(167,139,250,.15);color:#a78bfa;}
.card-info{flex:1;min-width:0;}
.card-nome{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-sub{font-size:12px;color:var(--muted);margin-top:3px;font-weight:600;}
.card-orario{font-family:'Space Mono',monospace;font-size:12px;text-align:right;flex-shrink:0;}
.orario-time{font-weight:700;color:var(--text);}
.orario-tag{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-top:3px;font-family:'Syne',sans-serif;}
.tag-disp{color:var(--celeste);}
.tag-doppio{color:#a78bfa;}

/* EMPTY */
.empty-state{text-align:center;padding:40px 20px;color:var(--muted);}
.empty-state .icon{font-size:36px;margin-bottom:10px;}

/* LEGEND */
.legend{padding:10px 14px 6px;display:flex;flex-wrap:wrap;gap:10px;border-top:1px solid var(--border);margin-top:6px;}
.legend-item{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted);font-weight:600;}
.legend-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.spacer{height:60px;}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;}
.modal-overlay.open{display:block;}
.modal{background:var(--surface);border-top:1px solid var(--border);border-radius:20px 20px 0 0;width:100%;max-height:88vh;overflow-y:auto;padding:16px;position:fixed;bottom:0;left:0;right:0;}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 14px;}
.modal-nome{font-size:20px;font-weight:800;margin-bottom:3px;}
.modal-ruolo{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:16px;}
.modal-close{position:absolute;top:16px;right:16px;background:var(--surface2);border:1px solid var(--border);color:var(--text);width:30px;height:30px;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.day-header{text-align:center;font-size:9px;font-weight:700;color:var(--muted);letter-spacing:1px;padding:3px 0;}
.day-cell{border-radius:7px;padding:4px 2px;text-align:center;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
.day-num{font-size:10px;font-weight:700;color:var(--muted);}
.day-code{font-size:7px;font-weight:700;color:var(--text);word-break:break-all;text-align:center;line-height:1.2;}
.dc-m{background:rgba(245,158,11,.13);}
.dc-p{background:rgba(249,115,22,.11);}
.dc-n{background:rgba(99,102,241,.13);}
.dc-d{background:rgba(167,139,250,.13);}
.dc-g{background:rgba(16,185,129,.1);}
.dc-r{background:rgba(55,65,81,.17);}
.dc-a{background:rgba(239,68,68,.08);}
.dc-di{background:rgba(6,182,212,.11);}
.dc-sn{background:rgba(99,102,241,.07);}
.dc-today{outline:2px solid var(--accent);}
</style>
</head>
<body>

<!-- HEADER sempre visibile -->
<div class="header">
  <div class="header-top">
    <span class="logo">RSL · Mercitalia · Mag 2026</span>
    <span class="clock" id="clock">--:--</span>
  </div>
  <div style="display:flex;align-items:center;justify-content:space-between;">
    <span id="fascia-badge" class="fascia-badge fn">🌙 Notte</span>
    <span style="font-size:10px;color:var(--muted);" id="sett-label"></span>
  </div>
  <div class="date-nav" id="date-nav-row" style="display:none;">
    <button onclick="navIndietro()">‹</button>
    <span class="date-label" id="date-label">—</span>
    <button class="today-btn" onclick="goToday()">OGGI</button>

  <div class="fascia-sel-row" id="fascia-sel" style="display:none;">
    <button class="fascia-sel-btn" id="fs-mattina" onclick="setFasciaManuale('mattina')">☀️ Mattina</button>
    <button class="fascia-sel-btn" id="fs-pomeriggio" onclick="setFasciaManuale('pomeriggio')">🌆 Pomeriggio</button>

  </div>
</div>

<!-- HOME SCREEN -->
<div id="home-screen">
  <div class="home-wrap">
    <div class="home-logo">🚂</div>
    <div class="home-title">Turni RSL</div>
    <div class="home-sub">Mercitalia Shunting &amp; Terminal · Maggio 2026</div>
    <button class="home-btn home-btn-primary" onclick="goOggi()">

      <div id="home-search-results"></div>

</div>

<!-- APP SCREEN -->
<div id="app-screen" style="display:none;">
  <div class="search-bar">
    <input type="text" id="search" placeholder="🔍  Cerca dipendente..." oninput="render()"/>
  </div>
  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('tutti')" id="f-tutti">Tutti</button>
    <button class="filter-btn" onclick="setFilter('capoturno')" id="f-capoturno">Capoturno</button>
    <button class="filter-btn" onclick="setFilter('deviatore')" id="f-deviatore">Deviatori</button>
    <button class="filter-btn" onclick="setFilter('condotta')" id="f-condotta">Condotta</button>
    <button class="filter-btn" onclick="setFilter('manovra')" id="f-manovra">Manovra</button>
    <button class="filter-btn" onclick="setFilter('scorta')" id="f-scorta">Scorta</button>
    <button class="filter-btn" onclick="setFilter('traghetto')" id="f-traghetto">Traghetto</button>
    <button class="filter-btn" onclick="setFilter('posto7')" id="f-posto7">Posto 7</button>
    <button class="filter-btn" onclick="setFilter('giornaliero')" id="f-giornaliero">Giornaliero</button>

  <div class="count-bar" id="count-bar">— in servizio</div>
  <div id="main-content"></div>
  <div class="legend">

    <div class="legend-item"><div class="legend-dot" style="background:var(--pomeriggio)"></div>Pomeriggio</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--notte)"></div>Notte</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--celeste)"></div>Disponibile</div>

<!-- MODAL -->

    <div class="modal-handle"></div>
    <button class="modal-close" onclick="closeModalDirect()">×</button>

    <div class="month-grid" id="modal-grid"></div>

<script>
// ============================================================
// ORARI
// ============================================================
const ORARI={
  "M":{i:"06:00",f:"14:00",fa:"mattina"},"M1":{i:"06:00",f:"14:00",fa:"mattina"},
  "M3":{i:"06:00",f:"14:00",fa:"mattina"},"M4":{i:"06:00",f:"14:00",fa:"mattina"},
  "MCP1":{i:"06:00",f:"14:00",fa:"mattina"},"MCP2":{i:"06:00",f:"13:00",fa:"mattina"},
  "MCD":{i:"06:00",f:"14:00",fa:"mattina"},"mmp1":{i:"06:00",f:"14:00",fa:"mattina"},
  "mmp2":{i:"06:00",f:"13:00",fa:"mattina"},"mmp3":{i:"06:00",f:"14:00",fa:"mattina"},
  "mmd":{i:"06:00",f:"14:00",fa:"mattina"},"MT1":{i:"06:00",f:"14:00",fa:"mattina"},
  "MT2":{i:"06:00",f:"13:00",fa:"mattina"},"MT3":{i:"06:00",f:"14:00",fa:"mattina"},
  "MT4":{i:"06:00",f:"14:00",fa:"mattina"},"MT5":{i:"05:00",f:"13:00",fa:"mattina"},
  "M7V":{i:"07:00",f:"15:00",fa:"mattina"},"CTm":{i:"06:00",f:"14:00",fa:"mattina"},
  "P":{i:"14:00",f:"22:00",fa:"pomeriggio"},"P1":{i:"14:00",f:"22:00",fa:"pomeriggio"},
  "P3":{i:"14:00",f:"22:00",fa:"pomeriggio"},"PCP1":{i:"14:00",f:"22:00",fa:"pomeriggio"},
  "PCP2":{i:"13:00",f:"21:00",fa:"pomeriggio"},"PCP3":{i:"13:00",f:"20:36",fa:"pomeriggio"},
  "PCD":{i:"14:00",f:"22:00",fa:"pomeriggio"},"pmp1":{i:"14:00",f:"22:00",fa:"pomeriggio"},
  "pmp2":{i:"13:00",f:"21:00",fa:"pomeriggio"},"pmp3":{i:"14:00",f:"22:00",fa:"pomeriggio"},
  "pmp4":{i:"13:00",f:"20:36",fa:"pomeriggio"},"pmd":{i:"14:00",f:"22:00",fa:"pomeriggio"},
  "PT1":{i:"14:00",f:"22:00",fa:"pomeriggio"},"PT2":{i:"13:00",f:"21:00",fa:"pomeriggio"},
  "PT3":{i:"14:00",f:"22:00",fa:"pomeriggio"},"PT4":{i:"14:00",f:"22:00",fa:"pomeriggio"},
  "PT5":{i:"13:00",f:"21:00",fa:"pomeriggio"},"P7V":{i:"15:00",f:"23:00",fa:"pomeriggio"},
  "CTp":{i:"14:00",f:"22:00",fa:"pomeriggio"},
  "N1":{i:"22:00",f:"06:00",fa:"notte"},"N3":{i:"22:00",f:"06:00",fa:"notte"},
  "NCP1":{i:"22:00",f:"06:00",fa:"notte"},"NCP2":{i:"21:00",f:"06:00",fa:"notte"},
  "nmp1":{i:"22:00",f:"06:00",fa:"notte"},"nmp2":{i:"21:00",f:"06:00",fa:"notte"},
  "nmp3":{i:"22:00",f:"06:00",fa:"notte"},"nmd":{i:"22:00",f:"06:00",fa:"notte"},
  "NT1":{i:"22:00",f:"06:00",fa:"notte"},"NT2":{i:"21:00",f:"06:00",fa:"notte"},
  "NT3":{i:"22:00",f:"06:00",fa:"notte"},"CTn":{i:"22:00",f:"06:00",fa:"notte"},
  "G":{i:"08:30",f:"17:06",fa:"giorno"},"G CF":{i:"08:00",f:"16:36",fa:"giorno"},
  "GCF":{i:"08:00",f:"16:36",fa:"giorno"},"GVM":{i:"08:00",f:"16:36",fa:"giorno"},
  "G VM":{i:"08:00",f:"16:36",fa:"giorno"},
};

// ============================================================
// MANSIONE DAL CODICE
// ============================================================
function getMansione(codice, base){
  if(!codice) return base;
  const c=codice.trim();
  const cu=c.toUpperCase().replace(/\s/g,'');
  if(['R1','R2','RM','RIP','SN','ASS','DISP'].includes(cu)) return base;
  if(cu.startsWith('CT')) return 'capoturno';
  if(/^[MP]T\d/.test(cu)||/^NT\d/.test(cu)) return 'traghetto';
  if(cu.startsWith('G')) return 'giornaliero';
  if(cu.includes('7V')) return 'posto7';
  // Scorta pura: M, P, N soli o combinazioni M-N, P-N, M-P
  if(/^[PMN](-[PMN])?$/.test(cu)) return 'scorta';
  // Deviatori: P1, M1, N1, P3, M3, N3 — PRIMA del check condotta
  if(/^[PMN][13]$/.test(cu)) return 'deviatore';
  // Condotta (CP, CD) — dopo deviatori per non confondere P1 con PCP
  if(cu.includes('CP')||cu.includes('CD')) return 'condotta';
  if(base==='deviatore') return 'deviatore';
  if(base==='posto7') return 'posto7';
  return 'manovra';
}

// ============================================================
// PARSE TURNO
// ============================================================
function findOrario(c){
  const cl=c.toLowerCase();
  for(const k of Object.keys(ORARI)) if(k.toLowerCase()===cl) return ORARI[k];
  return null;
}

function parseTurno(codice){
  if(!codice||codice==='—') return null;
  const c=codice.trim();
  if(['R1','R2','RM','Rip'].includes(c)) return {tipo:'riposo',fa:'riposo'};
  if(c==='SN') return {tipo:'sn',fa:'notte',f:'06:00'};
  if(c==='ASS') return {tipo:'assente',fa:'assente'};
  if(c==='DISP') return {tipo:'disp',fa:'disp'};
  // Scorta pura M, P, N o combinazioni M-N, P-N, M-P
  if(/^[PMN](-[PMN])?$/i.test(c)){
    const prima=c[0].toUpperCase();
    const orMap={M:{i:'06:00',f:'14:00',fa:'mattina'},P:{i:'14:00',f:'22:00',fa:'pomeriggio'},N:{i:'22:00',f:'06:00',fa:'notte'}};
    const or=orMap[prima]||orMap['M'];
    return {tipo:'lavoro',fa:or.fa,i:or.i,f:or.f};
  }
  if(c.includes('-')){
    const parts=c.split('-');
    const a=parts[0].trim(), b=parts[1].trim();
    const oa=ORARI[a]||findOrario(a);
    const ob=ORARI[b]||findOrario(b);
    if(oa&&ob&&oa.fa!==ob.fa) return {tipo:'doppio',fa:'doppio',i:oa.i,f:ob.f,im:oa.f,in:ob.i};
  }
  const o=ORARI[c]||findOrario(c);
  if(o) return {tipo:'lavoro',fa:o.fa,i:o.i,f:o.f};
  const cu=c.toUpperCase();
  if(cu.startsWith('M')) return {tipo:'lavoro',fa:'mattina',i:'06:00',f:'14:00'};
  if(cu.startsWith('P')) return {tipo:'lavoro',fa:'pomeriggio',i:'14:00',f:'22:00'};
  if(cu.startsWith('N')) return {tipo:'lavoro',fa:'notte',i:'22:00',f:'06:00'};
  if(cu.startsWith('G')) return {tipo:'lavoro',fa:'giorno',i:'08:30',f:'17:06'};
  return null;
}

// ============================================================
// È ATTIVO?
// ============================================================
function isAttivo(codice, fascia){
  const t=parseTurno(codice);
  if(!t) return false;
  if(t.tipo==='riposo'||t.tipo==='assente') return false;
  if(t.tipo==='sn') return false;
  if(t.tipo==='disp') return fascia!=='notte';
  if(t.tipo==='doppio') return fascia==='mattina'||fascia==='notte';
  if(t.fa==='giorno') return fascia==='mattina'||fascia==='pomeriggio';
  return t.fa===fascia;
}

let currentDay=14;

let modalita='home'; // 'home' | 'oggi' | 'consultazione'
let fasciaManuale=null;
const FASCE=['mattina','pomeriggio','notte'];

// ============================================================
// FASCIA OPERATIVA
// Notte = 22-06: mezzanotte-06 appartiene al giorno precedente
// ============================================================
function getFasciaOperativa(){
  const now=new Date();
  const h=now.getHours();
  const t=h*60+now.getMinutes();
  if(t>=360&&t<840)  return {fascia:'mattina',   giorno:now.getDate()};
  if(t>=840&&t<1320) return {fascia:'pomeriggio', giorno:now.getDate()};
  if(t>=1320)        return {fascia:'notte',       giorno:now.getDate()};
  // 00:00-05:59 = ancora notte di ieri
  const ieri=new Date(now);
  ieri.setDate(now.getDate()-1);
  return {fascia:'notte', giorno:ieri.getDate()};
}

function getFasciaAttiva(){
  if(fasciaManuale) return fasciaManuale;
  return getFasciaOperativa().fascia;
}

// ============================================================
// NAVIGAZIONE FRECCE — sequenziale M→P→N→M giorno dopo
// ============================================================
function navAvanti(){
  const f=getFasciaAttiva();
  const idx=FASCE.indexOf(f);
  if(idx===2){ if(currentDay<31){currentDay++;fasciaManuale='mattina';} }
  else { fasciaManuale=FASCE[idx+1]; }
  updateFasciaSel();
  render();
}
function navIndietro(){
  const f=getFasciaAttiva();
  const idx=FASCE.indexOf(f);
  if(idx===0){ if(currentDay>1){currentDay--;fasciaManuale='notte';} }
  else { fasciaManuale=FASCE[idx-1]; }
  updateFasciaSel();
  render();
}

// ============================================================
// MODALITÀ
// ============================================================
function goOggi(){
  modalita='oggi';
  fasciaManuale=null;
  const op=getFasciaOperativa();
  const now=new Date();
  if(now.getFullYear()===2026&&now.getMonth()===4) currentDay=op.giorno;
  document.getElementById('home-screen').style.display='none';
  document.getElementById('app-screen').style.display='block';
  document.getElementById('date-nav-row').style.display='flex';
  document.getElementById('fascia-sel').style.display='flex';
  showBackBtn();
  updateFasciaSel();
  render();
}

function goConsultazione(){
  modalita='consultazione';
  const op=getFasciaOperativa();
  fasciaManuale=op.fascia;
  const now=new Date();
  if(now.getFullYear()===2026&&now.getMonth()===4) currentDay=op.giorno;
  document.getElementById('home-screen').style.display='none';
  document.getElementById('app-screen').style.display='block';
  document.getElementById('date-nav-row').style.display='flex';
  document.getElementById('fascia-sel').style.display='flex';
  showBackBtn();
  updateFasciaSel();
  render();
}

function goHome(){
  modalita='home';
  fasciaManuale=null;
  document.getElementById('home-screen').style.display='block';
  document.getElementById('app-screen').style.display='none';
  document.getElementById('date-nav-row').style.display='none';
  document.getElementById('fascia-sel').style.display='none';
  const b=document.getElementById('back-btn');
  if(b) b.remove();
}

function showBackBtn(){
  if(document.getElementById('back-btn')) return;
  const b=document.createElement('button');
  b.id='back-btn';
  b.textContent='← Home';
  b.style.cssText='position:fixed;bottom:20px;right:16px;background:var(--accent);border:none;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;font-weight:700;font-family:Syne,sans-serif;cursor:pointer;z-index:150;box-shadow:0 4px 20px rgba(59,130,246,.4);';
  b.onclick=goHome;
  document.body.appendChild(b);
}

function goToday(){
  const op=getFasciaOperativa();
  const now=new Date();
  if(now.getFullYear()===2026&&now.getMonth()===4) currentDay=op.giorno;
  fasciaManuale=op.fascia;
  updateFasciaSel();
  render();
}

function setFasciaManuale(f){
  fasciaManuale=f;
  updateFasciaSel();
  render();
}

function updateFasciaSel(){
  const attiva=getFasciaAttiva();
  ['mattina','pomeriggio','notte'].forEach(f=>{
    const btn=document.getElementById('fs-'+f);
    if(!btn) return;
    const map={mattina:'fas-m',pomeriggio:'fas-p',notte:'fas-n'};
    btn.className='fascia-sel-btn'+(attiva===f?' '+map[f]:'');
  });
}

function updateBadge(){
  const op=getFasciaOperativa();
  const badge=document.getElementById('fascia-badge');
  const fl={
    mattina:{c:'fm',t:'☀️ Mattina (06–14)'},
    pomeriggio:{c:'fp',t:'🌆 Pomeriggio (14–22)'},

// ============================================================
// HOME SEARCH
// ============================================================
function renderHomeSearch(){
  const q=document.getElementById('home-search').value.toLowerCase().trim();
  const res=document.getElementById('home-search-results');
  if(!q){res.innerHTML='';return;}
  const found=DIPENDENTI.filter(d=>d.n.toLowerCase().includes(q)).slice(0,6);
  if(!found.length){
    res.innerHTML='<div style="text-align:center;color:var(--muted);font-size:13px;padding:16px;">Nessun risultato</div>';
    return;
  }
  res.innerHTML=found.map(function(dip){
    const ini=dip.n.split(' ').slice(0,2).map(function(p){return p[0];}).join('');
    const gi=GRUPPI_INFO[dip.b];
    const ruolo=(gi?gi.l:dip.b)+' · '+(dip.s==='parco'?'Parco Prenestino':'San Lorenzo');
    const nm=dip.n.replace(/'/g,'&#39;');
    return '<div class="home-result-card" onclick="openModalByName(\''+nm+'\')">'
      +'<div class="home-result-av">'+ini+'</div>'
      +'<div><div class="home-result-nome">'+dip.n+'</div>'
      +'<div class="home-result-ruolo">'+ruolo+'</div></div>'
      +'</div>';
  }).join('');
}

function openModalByName(nome){
  openModal(nome);
}

// ============================================================
// RENDER PRINCIPALE
// ============================================================
function render(){
  const now=new Date();
  if(modalita==='oggi'&&!fasciaManuale){
    const op=getFasciaOperativa();
    if(now.getFullYear()===2026&&now.getMonth()===4) currentDay=op.giorno;
  }
  const fascia=getFasciaAttiva();

  document.getElementById('clock').textContent=
    now.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});

  const fl={
    mattina:{c:'fm',t:'☀️ Mattina (06–14)'},
    pomeriggio:{c:'fp',t:'🌆 Pomeriggio (14–22)'},
    notte:{c:'fn',t:'🌙 Notte (22–06)'}
  };
  const badge=document.getElementById('fascia-badge');
  badge.className='fascia-badge '+fl[fascia].c;
  badge.textContent=fl[fascia].t;

  const d=new Date(2026,4,currentDay);
  document.getElementById('date-label').textContent=
    NOMI_G[d.getDay()]+' '+currentDay+' Maggio 2026';
  document.getElementById('sett-label').textContent=
    'Sett. '+(17+Math.ceil(currentDay/7));

  updateFasciaSel();

  const q=document.getElementById('search').value.toLowerCase().trim();
  const sedi=[{k:'parco',l:'Parco Prenestino'},{k:'deposito',l:'San Lorenzo · Deposito'}];
  let totale=0, html='';

  sedi.forEach(function(sede){
    const gruppi={};
    GRUPPI_ORD.forEach(function(g){gruppi[g]=[];});

    DIPENDENTI.filter(function(d){return d.s===sede.k;}).forEach(function(dip){
      const codice=dip.t[currentDay-1]||'';
      if(q){if(!dip.n.toLowerCase().includes(q))return;}
      else{if(!isAttivo(codice,fascia))return;}
      const meff=getMansione(codice,dip.b);
      if(currentFilter!=='tutti'&&meff!==currentFilter)return;
      const grp=gruppi[meff]?meff:'manovra';
      gruppi[grp].push({dip:dip,codice:codice});
    });

    const haQc=GRUPPI_ORD.some(function(g){return gruppi[g].length>0;});
    if(!haQc)return;

    html+='<div class="sede-block"><div class="sede-title">'+sede.l+'</div>';
    GRUPPI_ORD.forEach(function(g){
      const items=gruppi[g];
      if(!items.length)return;
      totale+=items.length;
      const gi=GRUPPI_INFO[g];
      html+='<div class="gruppo-block"><div class="gruppo-header">'
        +'<span class="gruppo-icon">'+gi.ic+'</span>'
        +'<span class="gruppo-nome">'+gi.l+'</span>'
        +'<span class="gruppo-count">'+items.length+'</span>'
        +'</div><div class="gruppo-cards">';
      items.forEach(function(item){html+=renderCard(item.dip,item.codice,fascia);});
      html+='</div></div>';
    });
    html+='</div>';
  });

  if(!html) html='<div class="empty-state"><div class="icon">😴</div><p>Nessuno in servizio in questo momento</p></div>';
  document.getElementById('count-bar').textContent=
    totale+' person'+(totale===1?'a':'e')+' in servizio';
  document.getElementById('main-content').innerHTML=html;
}

function renderCard(dip,codice,fascia){
  const t=parseTurno(codice);
  let cc='',av='ar',ot='',tag='';
  if(t){
    if(t.tipo==='riposo'){cc='cc-riposo';av='ar';}
    else if(t.tipo==='assente'){cc='cc-assente';av='aa';}
    else if(t.tipo==='sn'){cc='cc-sn';av='an';ot='<div class="orario-time">–06:00</div>';}
    else if(t.tipo==='disp'){cc='cc-disp';av='ad';ot='<div class="orario-time">—</div>';tag='<div class="orario-tag tag-disp">DISP</div>';}
    else if(t.tipo==='doppio'){
      cc='cc-doppio';av='adp';
      ot='<div class="orario-time">'+(fascia==='mattina'?t.i+'–'+t.im:t.in+'–'+t.f)+'</div>';
      tag='<div class="orario-tag tag-doppio">M+N</div>';
    }
    else{
      if(t.fa==='giorno'&&fascia==='notte') return '';
      var fc={mattina:'cc-mattina',pomeriggio:'cc-pomeriggio',notte:'cc-notte',giorno:'cc-giorno'};
      var av2={mattina:'am',pomeriggio:'ap',notte:'an',giorno:'ag'};
      cc=fc[t.fa]||'cc-mattina';
      av=av2[t.fa]||'am';
      if(t.i) ot='<div class="orario-time">'+t.i+'–'+t.f+'</div>';
    }
  }
  const ini=dip.n.split(' ').slice(0,2).map(function(p){return p[0];}).join('');
  const nm=dip.n.replace(/'/g,'&#39;');
  return '<div class="turno-card '+cc+'" onclick="openModal(\''+nm+'\')"><div class="avatar '+av+'">'+ini+'</div><div class="card-info"><div class="card-nome">'+dip.n+'</div><div class="card-sub">'+codice+'</div></div><div class="card-orario">'+ot+tag+'</div></div>';
}

// MODAL
// ============================================================
function openModal(nome){
  const dip=DIPENDENTI.find(function(d){return d.n===nome;});
  if(!dip)return;
  document.getElementById('modal-nome').textContent=dip.n;
  const gi=GRUPPI_INFO[dip.b];
  document.getElementById('modal-ruolo').textContent=
    (gi?gi.l:dip.b)+' · '+(dip.s==='parco'?'Parco Prenestino':'San Lorenzo');

  const primo=new Date(2026,4,1).getDay();
  var g='';
  NOMI_G.forEach(function(x){g+='<div class="day-header">'+x+'</div>';});
  for(var i=0;i<primo;i++) g+='<div></div>';
  for(var gg=1;gg<=31;gg++){
    const c=dip.t[gg-1]||'—';
    const t=parseTurno(c);
    const dcMap={riposo:'dc-r',assente:'dc-a',sn:'dc-sn',disp:'dc-di',doppio:'dc-d',mattina:'dc-m',pomeriggio:'dc-p',notte:'dc-n',giorno:'dc-g'};
    var dc='';
    if(t) dc=dcMap[t.tipo==='lavoro'?t.fa:t.tipo]||'';
    if(gg===currentDay) dc+=' dc-today';
    const abbr=c.length>7?c.substring(0,7):c;
    g+='<div class="day-cell '+dc+'"><div class="day-num">'+gg+'</div><div class="day-code">'+abbr+'</div></div>';
  }
  document.getElementById('modal-grid').innerHTML=g;
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(e){
  if(e.target===document.getElementById('modal-overlay'))
    document.getElementById('modal-overlay').classList.remove('open');
}
function closeModalDirect(){
  document.getElementById('modal-overlay').classList.remove('open');
}

function setFilter(f){
  currentFilter=f;
  document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});
  document.getElementById('f-'+f).classList.add('active');
  render();
}
